name: Publish Tuda desktop npm
on:
  workflow_dispatch:
    inputs:
      release:
        description: Exact version already committed in app and desktop package
        type: string
        required: true
      tag:
        description: npm channel
        type: choice
        options: [next, latest]
        default: next
      resume_run:
        description: Reuse an exact verified desktop run after accepted payload uploads
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: tuda-desktop-npm-publication
  cancel-in-progress: false
jobs:
  verify:
    if: ${{ !inputs.resume_run }}
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:subprojects
      - run: pnpm build:cli
      - run: pnpm exec install-electron
      - name: Verify the requested committed version
        env:
          RELEASE_VERSION: ${{ inputs.release }}
        run: node -e "const p=require('./package.json'),c=require('./desktop-package/package.json');if(process.env.RELEASE_VERSION!==p.version||c.version!==p.version)throw Error('Commit matching application and desktop package versions, then request that exact version.')"
      - run: pnpm plugins:build
      - run: pnpm brand:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec vitest run --maxWorkers=4 --minWorkers=1
      - run: pnpm release --arch x64
        env:
          TUDA_COMPANY_DEFAULTS_JSON: ${{ secrets.TUDA_COMPANY_DEFAULTS_JSON }}
      - name: Prepare expected deployment defaults
        shell: pwsh
        env:
          TUDA_COMPANY_DEFAULTS_JSON: ${{ secrets.TUDA_COMPANY_DEFAULTS_JSON }}
        run: |
          $prepared = node scripts/prepare-company-defaults.mjs --staging-root "$env:RUNNER_TEMP/tuda-expected-defaults" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "TUDA_E2E_COMPANY_DEFAULTS_FILE=$($prepared.file)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install the actual Windows release
        shell: pwsh
        env:
          PACKAGE_VERSION: ${{ inputs.release }}
        run: |
          $target = Join-Path $env:RUNNER_TEMP 'Tuda-installed'
          if (Test-Path $target) { throw 'Install target exists' }
          $installer = Join-Path $PWD "release/Tuda-$env:PACKAGE_VERSION-x64.exe"
          $process = Start-Process $installer -ArgumentList @('/S', '/CURRENTUSER', "/D=$target") -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Installer failed' }
          "TUDA_E2E_ELECTRON=$target/Tuda.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          'TUDA_E2E_PACKAGED=1' | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify installed Pi runtime, defaults and workspace persistence
        run: node scripts/playwright-electron-smoke.mjs
      - name: Verify standalone company connection defaults
        env:
          TUDA_E2E_STANDALONE: '1'
        run: node scripts/playwright-electron-smoke.mjs
      - run: node scripts/prepare-release-manifest.mjs --arch x64
      - run: node desktop-package/validate.mjs
      - run: npm pack ./desktop-package --pack-destination release
      - name: Stage desktop manifest beside installer
        shell: pwsh
        run: |
          if (Test-Path release/release-manifest.json) { throw 'Manifest target exists' }
          Copy-Item desktop-package/release-manifest.json release/release-manifest.json
      - uses: actions/upload-artifact@v4
        with:
          name: tuda-verified-release
          path: |
            release/*.exe
            release/*.tgz
            release/npm-payloads-*/*.tgz
            release/release-manifest.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuda-windows-evidence
          path: |
            output/package-size/*.json
            output/playwright/tuda-smoke-*/**
  publish:
    if: ${{ always() && (inputs.resume_run || needs.verify.result == 'success') }}
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify native artifact recovery provenance
        if: inputs.resume_run
        env:
          GH_TOKEN: ${{ github.token }}
          RESUME_RUN: ${{ inputs.resume_run }}
          RELEASE_VERSION: ${{ inputs.release }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {execFileSync} from 'node:child_process';
          const id=process.env.RESUME_RUN; assert.match(id,/^[0-9]+$/);
          const api=p=>JSON.parse(execFileSync('gh',['api',p],{encoding:'utf8'}));
          const base='repos/'+process.env.GITHUB_REPOSITORY+'/actions/runs/'+id;
          const run=api(base);
          assert.equal(run.path,'.github/workflows/publish-npm.yml');
          assert.equal(run.head_repository.full_name,process.env.GITHUB_REPOSITORY);
          assert.equal(api(base+'/jobs').jobs.find(j=>j.name==='verify')?.conclusion,'success');
          assert(api(base+'/artifacts').artifacts.some(a=>a.name==='tuda-verified-release'&&!a.expired));
          const changed=execFileSync('git',['diff','--name-only',run.head_sha,'HEAD'],{encoding:'utf8'}).trim().split('\n').filter(Boolean);
          const allowed=new Set(['.github/workflows/publish-npm.yml','scripts/verify-npm-release.mjs','scripts/verify-desktop-publication.mjs','docs/marketing/publications.md','docs/tuda-windows-release.md']);
          assert(changed.every(p=>allowed.has(p)),'Native build inputs changed; run complete Windows verification');
          const original=JSON.parse(execFileSync('git',['show',run.head_sha+':desktop-package/package.json'],{encoding:'utf8'}));
          assert.equal(original.version,process.env.RELEASE_VERSION);
          console.log(JSON.stringify({ok:true,nativeSource:run.head_sha,nativeRun:run.id,publicationSource:process.env.GITHUB_SHA,changedPublicationInputs:changed}));
          JS
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@11
      - uses: actions/download-artifact@v4
        with:
          name: tuda-verified-release
          path: candidate
          run-id: ${{ inputs.resume_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify archive, publish npm payloads and manager through OIDC
        env:
          GH_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ inputs.tag }}
          RESUME_RUN: ${{ inputs.resume_run }}
        run: |
          set -euo pipefail
          VERSION=$(node -p 'require("./desktop-package/package.json").version')
          if [[ "$VERSION" == *-* && "$DIST_TAG" != next ]]; then exit 1; fi
          INSTALLER="$(find candidate -name 'Tuda-*.exe' -type f)"
          TARBALL="$(find candidate -name '*.tgz' -type f ! -name '*-payload.*')"
          MANIFEST="$(find candidate -name release-manifest.json -type f)"
          node -e 'const fs=require("fs"),c=require("crypto"),m=JSON.parse(fs.readFileSync(process.argv[1])),b=fs.readFileSync(process.argv[2]);if(c.createHash("sha256").update(b).digest("hex")!==m.installers[0].sha256)throw Error("installer integrity")' "$MANIFEST" "$INSTALLER"
          tar -xzf "$TARBALL" -C candidate
          node -e 'const p=require("./candidate/package/package.json"),m=require(process.argv[1]);if(JSON.stringify(p.tudaRelease)!==JSON.stringify(m))throw Error("manifest drift")' "$(realpath "$MANIFEST")"
          if [[ -z "$RESUME_RUN" ]]; then
          while IFS= read -r -d '' PAYLOAD; do
            PAYLOAD_VERSION=$(tar -xOf "$PAYLOAD" package/package.json | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')
            if npm view "@petercjl/tuda-desktop@$PAYLOAD_VERSION" version >/dev/null 2>&1; then
              npm view "@petercjl/tuda-desktop@$PAYLOAD_VERSION" dist.integrity --json > candidate/existing-integrity.json
              node -e 'const f=require("fs"),c=require("crypto");if(JSON.parse(f.readFileSync("candidate/existing-integrity.json"))!=="sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))throw Error("Existing payload differs; preserve release state")' "$PAYLOAD"
            else
              npm publish "$PAYLOAD" --access public --provenance --tag payload
            fi
          done < <(find candidate -name '*-payload.*.tgz' -type f -print0)
          fi
          node scripts/verify-npm-release.mjs "$MANIFEST"
          EXPECTED_INTEGRITY=$(node -e 'const c=require("crypto"),f=require("fs");console.log("sha512-"+c.createHash("sha512").update(f.readFileSync(process.argv[1])).digest("base64"))' "$TARBALL")
          if npm view "@petercjl/tuda-desktop@$VERSION" dist.integrity --json > candidate/manager-integrity.json 2>/dev/null; then
            EXPECTED_INTEGRITY="$EXPECTED_INTEGRITY" node -e 'const f=require("fs");if(JSON.parse(f.readFileSync("candidate/manager-integrity.json"))!==process.env.EXPECTED_INTEGRITY)throw Error("Existing stable archive differs")'
          else
            npm publish "$TARBALL" --access public --provenance --tag "$DIST_TAG"
          fi
          node scripts/verify-desktop-publication.mjs "$VERSION" "$DIST_TAG" "$EXPECTED_INTEGRITY"
