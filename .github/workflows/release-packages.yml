name: Build Tuda Windows installers
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix cli
      - run: pnpm exec install-electron
      - run: pnpm release --arch x64
      - uses: actions/upload-artifact@v4
        with:
          name: tuda-windows-x64
          if-no-files-found: error
          path: |
            release/*.exe
            output/package-size/*.json
