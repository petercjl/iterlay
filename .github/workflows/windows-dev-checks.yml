name: Tuda Windows build verification
on:
  push:
    branches: [main, feature/tuda-app]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: npm ci --prefix cli
      - run: pnpm exec install-electron
      - run: pnpm release --arch x64
        env:
          TUDA_COMPANY_DEFAULTS_JSON: ${{ secrets.TUDA_COMPANY_DEFAULTS_JSON }}
      - run: node scripts/test-cli-package.mjs
      - run: node scripts/playwright-electron-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tuda-windows-verification
          path: |
            release/*.exe
            output/package-size/*.json
            output/playwright/tuda-smoke-*/**
